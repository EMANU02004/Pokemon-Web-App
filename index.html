<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple Pokémon search page using the PokéAPI.">
  <title>My Pokémon List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="page-header">
    <div class="header-content">
      <h1>My Pokémon List</h1>
      <p>Browse Pokémon from the PokéAPI.</p>
      <div class="search-wrap">
        <label for="search-input">Search:</label>
        <input id="search-input" type="search" placeholder="Type a name..." autocomplete="off">
        <span id="result-count" class="result-count"></span>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="section-heading">
      <div>
        <h2>Pokémon</h2>
      </div>
      <p id="status-message" class="status-message" role="status">Loading Pokémon...</p>
    </div>

    <section id="pokemon-grid" class="pokemon-grid" aria-live="polite"></section>
    <div id="empty-state" class="empty-state" hidden>
      <h3>No Pokémon found</h3>
      <p>Try searching for a different name.</p>
    </div>
    <nav class="pagination" aria-label="Pokémon pages">
      <button id="previous-button" type="button">Previous</button>
      <span id="page-number">Page 1</span>
      <button id="next-button" type="button">Next</button>
    </nav>
  </main>

</body>
</html>
